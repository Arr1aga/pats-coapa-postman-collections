$kind: http-request
description: Soft-delete a role (requires roles:write, cannot delete admin, fails if users assigned)
url: "{{GATEWAY_URL}}/roles/:id"
method: DELETE
headers:
  Content-Type: application/json
pathVariables:
  id: ""
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/Delete Role.resources/examples
order: 5000
