$kind: http-example
request:
  url: "{{GATEWAY_URL}}/admin/users/:id"
  method: DELETE
  headers:
    Authorization: Bearer {{ACCESS_TOKEN}}
  pathVariables:
    id: usr_abc123
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "UNAUTHORIZED",
        "message": "Missing Bearer token"
      }
order: 2000
