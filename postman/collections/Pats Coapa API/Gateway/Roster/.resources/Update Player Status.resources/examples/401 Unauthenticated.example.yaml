$kind: http-example
request:
  url: "{{ROSTER_URL}}/roster/player/:id/status"
  method: PATCH
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  pathVariables:
    id: plr_abc123
  body:
    type: json
    content: |-
      {
        "status": "active"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "UNAUTHENTICATED",
        "message": "Missing actor identity"
      }
order: 2000
