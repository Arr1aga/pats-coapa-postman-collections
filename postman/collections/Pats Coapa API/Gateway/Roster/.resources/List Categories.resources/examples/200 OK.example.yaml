$kind: http-example
request:
  url: "{{GATEWAY_URL}}/roster/categories"
  method: GET
  headers:
    Authorization: Bearer {{ACCESS_TOKEN}}
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": "rabbits",
          "name": "Rabbits"
        },
        {
          "id": "hornets",
          "name": "Hornets"
        }
      ]
order: 1000
