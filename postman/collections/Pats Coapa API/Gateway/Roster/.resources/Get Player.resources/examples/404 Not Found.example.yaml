$kind: http-example
request:
  url: "{{ROSTER_URL}}/roster/player/:id"
  method: GET
  headers:
    Authorization: Bearer {{ACCESS_TOKEN}}
  pathVariables:
    id: plr_abc123
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "NOT_FOUND",
        "message": "Player not found"
      }
order: 4000
