$kind: http-request
description: Upsert marks into the session by playerId (merge, not full replace). Only sent marks are affected.
url: "{{GATEWAY_URL}}/attendance/sessions/rabbits/today"
method: PUT
headers:
  Authorization: Bearer {{ACCESS_TOKEN}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "marks": [
        {
          "player_id": "00000000-0000-4000-8000-000000000001",
          "status": "present",
          "timestamp": "2026-06-05T18:00:00.000Z"
        }
      ]
    }
examples: ./.resources/Update Session.resources/examples
order: 2000
