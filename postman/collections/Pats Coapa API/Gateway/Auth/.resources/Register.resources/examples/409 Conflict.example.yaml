$kind: http-example
request:
  url: "{{GATEWAY_URL}}/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "tutor@patscoapa.mx",
        "password": "password123",
        "displayName": "Ana García",
        "phone": "+52 55 1234 5678"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "CONFLICT",
        "message": "Email already registered"
      }
order: 2000
