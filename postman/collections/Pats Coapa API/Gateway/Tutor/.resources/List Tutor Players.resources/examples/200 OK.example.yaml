    content: |-
      {
        "players": [
          {
            "id": "plr_abc123",
            "name": "Carlos Pérez",
            "jerseyNumber": 12,
            "categoryId": "rabbits",
            "status": "active"
          },
          {
            "id": "plr_def456",
            "name": "Miguel Torres",
            "jerseyNumber": 77,
            "categoryId": "hornets",
            "status": "pending"
          }
        ]
      }
order: 1000
