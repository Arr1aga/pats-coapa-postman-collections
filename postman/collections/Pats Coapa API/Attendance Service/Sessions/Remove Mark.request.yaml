$kind: http-request
description: Removes a single mark from the session. Returns the updated session. No-op if the player has no mark.
url: "{{GATEWAY_URL}}/attendance/sessions/rabbits/today/marks/{{PLAYER_ID}}"
method: DELETE
headers:
  Authorization: Bearer {{ACCESS_TOKEN}}
examples: ./.resources/Remove Mark.resources/examples
order: 4000
