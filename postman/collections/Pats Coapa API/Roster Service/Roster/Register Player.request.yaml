$kind: http-request
description: "Register a player. Allowed roles: parent, admin, head_coach, staff_manager."
url: "{{ROSTER_URL}}/roster/players/:category"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  category: rabbits
body:
  type: json
  content: |-
    {
      "name": "Carlos Test",
      "jerseyNumber": 77,
      "position": "RB",
      "age": 13,
      "height": 155,
      "weight": 50,
      "size": "S",
      "tutorName": "Luis Test",
      "tutorPhone": "5512345678",
      "tutorRelation": "Padre",
      "medicalAlert": null,
      "medicalDetail": null
    }
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/Register Player.resources/examples
order: 3000
