$kind: http-example
request:
  url: "{{ROSTER_URL}}/roster/player/:id"
  method: GET
  headers:
    Authorization: Bearer {{ACCESS_TOKEN}}
  pathVariables:
    id: plr_abc123
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "FORBIDDEN",
        "message": "Permission 'roster:read' required"
      }
order: 3000
