    type: json
    content: |-
      {
        "categories": [
          {
            "id": "rabbits",
            "name": "Rabbits",
            "ageRange": "6-8",
            "minAge": 6,
            "maxAge": 8,
            "playerCount": 12
          },
          {
            "id": "hornets",
            "name": "Hornets",
            "ageRange": "9-10",
            "minAge": 9,
            "maxAge": 10,
            "playerCount": 18
          }
        ]
      }
order: 1000
