$kind: http-request
description: Replace all events for a given month (YYYY-MM)
url: "{{CALENDAR_URL}}/calendar/:month"
method: PUT
headers:
  x-actor-id: "{{HC_USER_ID}}"
  x-actor-role: head_coach
  x-actor-categories: "[]"
  Content-Type: application/json
pathVariables:
  - key: month
    value: 2026-07
    description: Month in YYYY-MM format
body:
  type: json
  content: |-
    {
      "events": [
        {
          "date": "2026-07-15",
          "kind": "training",
          "title": "Entrenamiento Irons",
          "time": "17:00",
          "field": "Campo 1",
          "opponent": null,
          "categoryIds": [
            "irons"
          ],
          "seriesId": null,
          "recurrenceWeekdays": [],
          "recurrenceEndDate": null
        }
      ]
    }
examples: ./.resources/Replace Month.resources/examples
order: 2000
