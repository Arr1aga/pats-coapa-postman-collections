$kind: http-example
request:
  url: "{{AUTH_URL}}/roles"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    content: |-
      {
        "id": "example",
        "name": "example",
        "permissions": ["example"]
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "UNAUTHORIZED",
        "message": "Missing Bearer token"
      }
order: 2000
