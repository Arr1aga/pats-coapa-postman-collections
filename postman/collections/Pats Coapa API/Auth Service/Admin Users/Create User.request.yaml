$kind: http-request
description: Create a user with any role (requires users:write permission)
url: "{{AUTH_URL}}/admin/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "password123",
      "displayName": "example",
      "role": "example",
      "phone": "example"
    }
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/Create User.resources/examples
order: 2000
