$kind: http-example
request:
  url: "{{AUTH_URL}}/admin/users"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    content: |-
      {
        "email": "user@example.com",
        "password": "password123",
        "displayName": "example",
        "role": "example",
        "phone": "example"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "CONFLICT",
        "message": "Email already registered"
      }
order: 4000
