$kind: http-example
request:
  url: "{{AUTH_URL}}/admin/users"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    content: |-
      {
        "email": "user@example.com",
        "password": "password123",
        "displayName": "example",
        "role": "example",
        "phone": "example"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "FORBIDDEN",
        "message": "Permission 'roles:write' required"
      }
order: 3000
