$kind: http-example
request:
  url: "{{AUTH_URL}}/admin/users/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "role": "example",
        "displayName": "example"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "usr_xyz789",
        "email": "headcoach@patscoapa.mx",
        "displayName": "Carlos López",
        "phone": "+52 55 1234 5678",
        "role": "head_coach"
      }
order: 1000
