$kind: http-request
description: Remove device token
url: "{{AUTH_URL}}/auth/device-token"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "example"
    }
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/Delete Device Token.resources/examples
order: 6000
