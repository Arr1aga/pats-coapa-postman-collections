$kind: http-example
request:
  url: "{{AUTH_URL}}/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "user@example.com",
        "password": "password123",
        "displayName": "example",
        "phone": "example"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "VALIDATION_ERROR",
        "message": "Invalid email"
      }
order: 3000
