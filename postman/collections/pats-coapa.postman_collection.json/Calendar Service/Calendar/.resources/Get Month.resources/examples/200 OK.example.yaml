$kind: http-example
request:
  url: "{{CALENDAR_URL}}/calendar/:month"
  method: GET
  headers:
    x-actor-id: "{{HC_USER_ID}}"
    x-actor-role: head_coach
    x-actor-categories: "[]"
  pathVariables:
    - key: month
      value: 2026-06
      description: Month in YYYY-MM format
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "month": "2026-06",
        "month_label": "Junio 2026",
        "events": [
          {
            "id": "019600000000700080000000000001",
            "date": "2026-06-10",
            "kind": "training",
            "title": "Entrenamiento Irons",
            "time": "17:00",
            "field": "Campo 1",
            "opponent": null,
            "categoryIds": [
              "irons"
            ],
            "seriesId": null,
            "recurrenceWeekdays": [],
            "recurrenceEndDate": null
          }
        ]
      }
order: 1000
