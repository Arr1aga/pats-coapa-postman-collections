$kind: http-request
description: Get all events for a given month (YYYY-MM)
url: "{{CALENDAR_URL}}/calendar/:month"
method: GET
headers:
  x-actor-id: "{{HC_USER_ID}}"
  x-actor-role: head_coach
  x-actor-categories: "[]"
pathVariables:
  - key: month
    value: 2026-06
    description: Month in YYYY-MM format
examples: ./.resources/Get Month.resources/examples
order: 1000
