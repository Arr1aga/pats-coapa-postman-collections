$kind: http-request
description: Register a new tutor (parent) account
url: "{{AUTH_URL}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "password123",
      "displayName": "example",
      "phone": "example"
    }
examples: ./.resources/Register.resources/examples
order: 2000
