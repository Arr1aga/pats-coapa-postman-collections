$kind: http-request
description: Soft-delete a user — record remains in MongoDB (requires users:write permission)
url: "{{AUTH_URL}}/admin/users/:id"
method: DELETE
headers:
  Content-Type: application/json
pathVariables:
  id: ""
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/Delete User.resources/examples
order: 4000
