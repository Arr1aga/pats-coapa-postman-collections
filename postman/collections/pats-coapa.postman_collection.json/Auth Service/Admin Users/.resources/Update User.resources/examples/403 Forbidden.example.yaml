$kind: http-example
request:
  url: "{{AUTH_URL}}/admin/users/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "role": "example",
        "displayName": "example"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "FORBIDDEN",
        "message": "Permission 'roles:write' required"
      }
order: 3000
