$kind: http-request
description: Update user role or displayName (requires users:write permission)
url: "{{AUTH_URL}}/admin/users/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  id: ""
body:
  type: json
  content: |-
    {
      "role": "example",
      "displayName": "example"
    }
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/Update User.resources/examples
order: 3000
