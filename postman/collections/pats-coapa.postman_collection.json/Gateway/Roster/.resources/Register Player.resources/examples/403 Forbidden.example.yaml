$kind: http-example
request:
  url: "{{ROSTER_URL}}/roster/players/:category"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  pathVariables:
    category: rabbits
  body:
    type: json
    content: |-
      {
        "name": "Carlos Test",
        "jerseyNumber": 77,
        "position": "RB",
        "age": 13,
        "height": 155,
        "weight": 50,
        "size": "S",
        "tutorName": "Luis Test",
        "tutorPhone": "5512345678",
        "tutorRelation": "Padre",
        "medicalAlert": null,
        "medicalDetail": null
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "FORBIDDEN",
        "message": "Insufficient role to perform this action"
      }
order: 4000
