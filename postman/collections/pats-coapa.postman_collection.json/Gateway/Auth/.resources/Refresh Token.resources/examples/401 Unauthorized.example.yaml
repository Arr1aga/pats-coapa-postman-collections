$kind: http-example
request:
  url: "{{GATEWAY_URL}}/auth/refresh"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "eyJhbGciOiJSUzI1NiJ9.eyJqdGkiOiJydGtfZGVmNDU2In0.signature"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "UNAUTHORIZED",
        "message": "Refresh token expired or revoked"
      }
order: 2000
