$kind: http-request
description: Proxy → auth-service POST /admin/users
url: "{{GATEWAY_URL}}/admin/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "coach@test.com",
      "displayName": "Coach Test",
      "role": "coach",
      "password": "Abcd1234!"
    }
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/Create User.resources/examples
order: 2000
