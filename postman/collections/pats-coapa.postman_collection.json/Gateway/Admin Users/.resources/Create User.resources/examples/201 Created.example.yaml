$kind: http-example
request:
  url: "{{GATEWAY_URL}}/admin/users"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    content: |-
      {
        "email": "coach@test.com",
        "displayName": "Coach Test",
        "role": "coach",
        "password": "Abcd1234!"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "usr_abc123",
        "email": "coach@test.com",
        "displayName": "Coach Test",
        "role": "coach"
      }
order: 1000
