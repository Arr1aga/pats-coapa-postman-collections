$kind: http-example
request:
  url: "{{GATEWAY_URL}}/admin/users/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ACCESS_TOKEN}}
  pathVariables:
    id: usr_abc123
  body:
    type: json
    content: |-
      {
        "displayName": "Updated Name"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "NOT_FOUND",
        "message": "User not found"
      }
order: 3000
