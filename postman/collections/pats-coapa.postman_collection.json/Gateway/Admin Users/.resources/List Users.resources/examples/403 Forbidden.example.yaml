$kind: http-example
request:
  url: "{{GATEWAY_URL}}/admin/users"
  method: GET
  headers:
    Authorization: Bearer {{ACCESS_TOKEN}}
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "FORBIDDEN",
        "message": "Insufficient permissions"
      }
order: 3000
